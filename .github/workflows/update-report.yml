# AI行业落地报告 - 自动抓取与即时更新
# 触发：① 手动 Run workflow  ② 每周一 00:00 UTC（北京 08:00）  ③ 每日 08:00 UTC（北京 16:00）  ④ push 到 main 时
# Serper：在 Settings → Secrets 添加 SERPER_API_KEY 后，自动爬取国内+国外关键词，写入 report-data.json
# 主报告顶部「最新动态与创业机会」区块自动展示 latest_updates
name: 报告自动更新

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'   # 每周一 00:00 UTC = 北京 08:00
    - cron: '0 8 * * *'   # 每日 08:00 UTC = 北京 16:00
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/update-report.yml'

concurrency:
  group: report-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取数据
        run: python scripts/fetch_data.py
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      - name: 检查变更
        id: changes
        run: |
          if git diff --quiet data/report-data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 提交并推送
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/report-data.json
          git commit -m "chore: 自动更新报告数据 [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
